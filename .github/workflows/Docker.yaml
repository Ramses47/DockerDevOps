name: Buildear Imagen

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  construir:
    name: Lint y Construcción
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
  construir:
    name: construir
    needs: revisar
    runs on: ubuntu-latest

    steps:
      - name: Construir Imagen
        uses: action/checkout@v4
        run: docker build -t etiqueta.