name: main Imagen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    name: Lint y Construccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006
  
  publicar:
    needs: revisar
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t servidor-minecraft:latest .

      - name: Exportar imagen
        run: docker save servidor-minecraft:latest -o servidor.tar

      - name: Subir imagen
        uses: actions/upload-artifact@v4
        with:
          name: imagen-docker
          path: servidor.tar
          compression-level: 0

  importar-windows:
    name: Importar en Windows
    runs-on: windows-latest
    needs: construir

    steps:
      - name: Descargar artifact
        uses: action/download-artifact@v8
        with:
          name: imagen-docker
          
      - name: verificar imagen
        shell: pwsh
        run: Get-Item servidor.tar

      - name: Cargar imagen de docker
        shell: pwsh
        run: docker load -i servidor.tar

      - name: verificar importacion
        shell: push
        run: |
          docker imagen
          docker inspect minecraft-server:latest 
