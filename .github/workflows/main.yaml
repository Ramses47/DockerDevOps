name: Buildear Imagen

on:
  push:
    #branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  revisar:
    name: Lint y Construcción
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006
  
  publicar:
    needs: revisar
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: action/checkout@v4

      - name: Construir imagen
        run: docker build -t servidor-minecraft:latest

      - name: Exportar imagen
        run: docker save servidor-minecraft:latest -o servidor-tar

      - name: Subir imagen
        uses: action/upload-artifact@v7
        with:
          name: imagen-docker
          path: servidor.tar
          compression-lavel: 0
