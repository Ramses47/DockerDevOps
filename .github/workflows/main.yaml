name: main Imagen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta Linux
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL4006

  # ---------- LINUX ----------
  construir-linux:
    name: Construir en Linux
    needs: revisar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -f Dockerfile -t servidor-minecraft:linux .

      - name: Exportar imagen
        run: docker save servidor-minecraft:linux -o servidor-linux.tar

      - name: Subir imagen
        uses: actions/upload-artifact@v4
        with:
          name: imagen-linux
          path: servidor-linux.tar
          compression-level: 0

  importar-linux:
    name: Importar en Linux
    needs: construir-linux
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: imagen-linux

      - name: Verificar archivo
        run: ls -lh servidor-linux.tar

      - name: Cargar imagen de Docker
        run: docker load -i servidor-linux.tar

      - name: Verificar importacion
        run: |
          docker images
          docker inspect servidor-minecraft:linux

  # ---------- WINDOWS ----------
  construir-windows:
    name: Construir en Windows
    needs: revisar
    runs-on: Windows

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        shell: pwsh
        run: docker build -f Dockerfile.windows -t servidor-minecraft:windows .

      - name: Exportar imagen
        shell: pwsh
        run: docker save servidor-minecraft:windows -o servidor-windows.tar

      - name: Subir imagen
        uses: actions/upload-artifact@v4
        with:
          name: imagen-windows
          path: servidor-windows.tar
          compression-level: 0

  importar-windows:
    name: Importar en Windows
    needs: construir-windows
    runs-on: Windows

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: imagen-windows

      - name: Verificar archivo
        shell: pwsh
        run: Get-Item servidor-windows.tar

      - name: Cargar imagen de Docker
        shell: pwsh
        run: docker load -i servidor-windows.tar

      - name: Verificar importacion
        shell: pwsh
        run: |
          docker images
          docker inspect servidor-minecraft:windows